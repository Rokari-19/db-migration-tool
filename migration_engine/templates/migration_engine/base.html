<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Migration Assistant</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  {% load static %}
  <link rel="stylesheet" href="{% static 'migration_engine/app.css' %}">
  <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script>
    window.MIGRATION_CONTEXT = {
      page: '{% block page %}{% endblock %}',
      jobId: '{% block job_id %}{% endblock %}'
    };
  </script>
  <script src="{% static 'migration_engine/app-react.js' %}"></script>
</body>
</html>
